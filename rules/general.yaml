- id: R-0004
  type: env
  subject: {mod: game}
  effect: warn
  requires_flags: ["missing_script_cache"]
  fix: {action: advise}
  message: "The compiled script file r6/cache/final.redscripts is missing, so the next launch recompiles every redscript mod before the main menu. That first start takes minutes; let it finish, and if it stops with a script error delete r6/cache and verify the game files."
