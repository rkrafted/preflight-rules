- id: S-codeware-persistent-dir
  log: codeware
  match: 'Cannot create directory "[^"]+" for persistent data'
  cause: persisted_state_failed
  implicates: [codeware]
  fix: {action: advise}
  message: "Codeware cannot create its state folder, so it cannot save data between sessions and some features reset. A read-only or missing user profile folder is the usual cause; check permissions on the Codeware state directory."
  evidence:
    - {kind: code, url: "https://github.com/psiberx/cp2077-codeware/blob/decce71323d6f6183cf78143882032a3c70aac9e/src/App/Scripting/ScriptingService.cpp#L39", observed: 2026-10-30}
  fixture: codeware-persistent-dir.log

- id: S-codeware-state-load
  log: codeware
  match: 'Can.t load state from'
  cause: persisted_state_failed
  implicates: [codeware]
  fix: {action: quarantine}
  message: "Codeware could not read its saved state file, so the state is ignored and features that depend on it start fresh. The file is corrupt; delete the Codeware state file and let Codeware recreate it."
  evidence:
    - {kind: code, url: "https://github.com/psiberx/cp2077-codeware/blob/decce71323d6f6183cf78143882032a3c70aac9e/src/App/Scripting/ScriptableServiceContainer.cpp#L89", observed: 2026-10-30}
  fixture: codeware-state-load.log

