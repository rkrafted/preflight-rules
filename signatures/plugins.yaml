  match: 'Copy "[^"]+" is an existing resource\.'
  cause: archive_resource_collision
  implicates: [archivexl]
  fix: {action: advise}
  message: "An ArchiveXL .xl copies a file to a path where another archive already provides one, so the copy is skipped and the mod's version does not appear. Remove the conflicting archive or the .xl copy."
  evidence:
